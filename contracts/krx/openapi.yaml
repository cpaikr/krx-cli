openapi: 3.1.1
info:
  title: KRX Open API wire contract
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description:
    Canonical wire contract for the KRX operations supported by krx-cli. All provider row
    values are strings.
servers:
  - url: https://data-dbg.krx.co.kr
x-krx-content-type: application/json; charset=utf-8
security:
  - KrxApiKey: []
tags:
  - name: index
    description: Index
  - name: stock
    description: Stock
  - name: etp
    description: Exchange-traded products
  - name: bond
    description: Bond
  - name: derivative
    description: Derivative
  - name: commodity
    description: Commodity
  - name: esg
    description: ESG
