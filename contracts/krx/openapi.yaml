  /svc/apis/idx/krx_dd_trd:
    post:
      operationId: index_krx_dd_trd
      tags:
        - index
      summary: KRX series index daily trading
      description: KRX 시리즈 지수 일별시세
      x-krx-cli-command: index.krx_dd_trd
      x-krx-official-modified: 2026/01/16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingDateRequest"
      responses:
        "200":
          description: A successful row envelope or provider error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IndexKrxDdTrdResponse"
                  - $ref: "#/components/schemas/KrxError"
        default:
          description: Provider or intermediary HTTP error; its body is optional and opaque.
