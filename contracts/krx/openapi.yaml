components:
  securitySchemes:
    KrxApiKey:
      type: apiKey
      in: header
      name: AUTH_KEY
      description: KRX Open API credential. Never log or persist in contract evidence.
  schemas:
    TradingDateRequest:
      type: object
      additionalProperties: false
      required:
        - basDd
      properties:
        basDd:
          type: string
          pattern: ^[0-9]{8}$
          description: Trading date in YYYYMMDD format
    KrxError:
      type: object
      description: Provider error envelope. At least one provider error field is present.
      anyOf:
        - required:
            - respCode
        - required:
            - respMsg
      properties:
        respCode:
          type: string
          description: Provider error code
          x-krx-error-role: code
        respMsg:
          type: string
          description: Provider error message
          x-krx-error-role: message
      additionalProperties: true
