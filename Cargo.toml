[workspace]
members = ["crates/krx-sdk", "crates/krx-cli", "crates/krx-node"]
resolver = "3"

[workspace.package]
version = "1.8.2"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
cap-std = "=4.0.3"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "=0.3.34"
jiff = { version = "=0.2.38", default-features = false, features = ["serde", "std"] }
keyring = "=4.2.0"
napi = { version = "=3.12.2", default-features = false, features = ["async", "napi8", "tokio_rt"] }
napi-build = "=2.6.0"
napi-derive = "=3.6.13"
num-bigint = "=0.5.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.20"
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
