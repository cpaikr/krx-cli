[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "Unmaintained (merged into zbus 6), not a vulnerability. Reached only via keyring -> zbus-secret-service-keyring-store -> secret-service -> zbus 5 on Linux; remove once that chain moves to zbus 6." },
  { id = "RUSTSEC-2026-0371", reason = "Unmaintained (merged into zbus 6), not a vulnerability. Reached only via keyring -> zbus-secret-service-keyring-store -> secret-service -> zbus 5 on Linux; remove once that chain moves to zbus 6." },
  { id = "RUSTSEC-2026-0372", reason = "Unmaintained (merged into zbus 6), not a vulnerability. Reached only via keyring -> zbus-secret-service-keyring-store -> secret-service -> zbus 5 on Linux; remove once that chain moves to zbus 6." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Registry dependencies are exact-pinned by the workspace manifest and lockfile.
# Path-only workspace edges have no publishable version requirement.
wildcards = "allow"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
