name: Rust SDK

on:
  pull_request:
    paths:
      - ".github/workflows/rust-sdk.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "contracts/generated/**"
      - "contracts/krx/**"
      - "contracts/product/**"
      - "crates/krx-sdk/**"
      - "rust-toolchain.toml"
      - "tests/scripts/release-policy.test.ts"
      - "tests/scripts/rust-sdk.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows remain supported artifact targets, but their SDK
        # tests are omitted from continuous CI to reduce compute cost.
        include:
          - arch: x64
            runner: blacksmith-2vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.92.0
          --profile minimal
          --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compile the production workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint the production workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test the production workspace
        run: cargo test --locked --workspace --all-features
