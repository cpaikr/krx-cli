name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack release artifact
        run: |
          mkdir -p release-artifact
          npm pack --json --ignore-scripts --pack-destination release-artifact

      - name: Smoke-test release artifact
        run: pnpm test:package -- release-artifact/*.tgz

      - name: Publish verified artifact
        run: npm publish release-artifact/*.tgz --provenance --access public
