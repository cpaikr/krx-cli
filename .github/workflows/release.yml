name: Tagged native release certification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  certify:
    name: Certify ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS ARM64 and Windows x64 remain supported manifest targets but are
        # omitted from CI to reduce compute cost. Their existing certification
        # evidence remains valid; release operators build them outside Actions.
        include:
          - id: linux-x64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            rust-target: x86_64-unknown-linux-gnu
            node-arch: x64
            binding: target/x86_64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/x86_64-unknown-linux-gnu/release/krx
          - id: linux-arm64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            rust-target: aarch64-unknown-linux-gnu
            node-arch: arm64
            binding: target/aarch64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/aarch64-unknown-linux-gnu/release/krx

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate maintainer contracts
        run: pnpm check

      - name: Install pinned Rust toolchain and target
        run: >-
          rustup toolchain install 1.92.0
          --profile minimal
          --target ${{ matrix.rust-target }}

      - name: Build the native release members
        run: >-
          cargo build --locked --release --target ${{ matrix.rust-target }}
          -p krx-cli -p krx-node

      - name: Assemble the private native archive
        run: >-
          node scripts/native-package/assemble.mjs
          --target ${{ matrix.id }}
          --binding ${{ matrix.binding }}
          --executable ${{ matrix.executable }}
          --out target/native-package/${{ matrix.id }}/package

      - name: Pack the private native archive
        run: >-
          node scripts/native-package/pack.mjs
          --package target/native-package/${{ matrix.id }}/package
          --target ${{ matrix.id }}
          --artifacts target/native-package/${{ matrix.id }}/artifacts

      - name: Certify the exact private archive
        shell: bash
        run: >-
          node scripts/native-package/certify.mjs
          --tarball target/native-package/${{ matrix.id }}/artifacts/*.tgz
          --target ${{ matrix.id }}
          --report target/native-package/${{ matrix.id }}/certification.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: krx-native-${{ matrix.id }}
          path: |
            target/native-package/${{ matrix.id }}/artifacts/*.tgz
            target/native-package/${{ matrix.id }}/certification.json
          if-no-files-found: error
          retention-days: 14
