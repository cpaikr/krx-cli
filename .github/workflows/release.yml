name: Tagged release certification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  certify:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack release artifact
        run: |
          mkdir -p release-artifact
          npm pack --json --ignore-scripts --pack-destination release-artifact

      - name: Smoke-test release artifact
        run: pnpm test:package -- release-artifact/*.tgz

      - name: Smoke-test Git installation
        env:
          PNPM_HOME: ${{ runner.temp }}/pnpm-home
        run: |
          mkdir -p "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          pnpm --global-dir "${{ runner.temp }}/pnpm-global" add --global --allow-build=krx-cli "git+file://${GITHUB_WORKSPACE}#${GITHUB_SHA}"
          krx --version
          krx --help >/dev/null
