# Build and publish all targets; automated tests and consumer certification run only on Linux.
name: Native release
on:
  push:
    tags:
      - v*
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo fetch --locked
      - name: Reconcile release source and version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-version.mjs check "$RELEASE_TAG"
      - run: pnpm check && pnpm calendar:check && pnpm audit:prod
      - name: Enforce Rust advisory, license, ban, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          command-arguments: advisories bans licenses sources
  verify-native:
    name: Verify Linux / ${{ matrix.runner }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Compile the production workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Lint the production workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test the host-native production workspace
        env:
          RUST_TEST_NOCAPTURE: "1"
        run: cargo test --locked --workspace --all-features
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            node-arch: arm64
            binding: target/aarch64-apple-darwin/release/libkrx_node.dylib
            executable: target/aarch64-apple-darwin/release/krx
          - id: linux-x64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            rust-target: x86_64-unknown-linux-gnu
            node-arch: x64
            binding: target/x86_64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/x86_64-unknown-linux-gnu/release/krx
          - id: linux-arm64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            rust-target: aarch64-unknown-linux-gnu
            node-arch: arm64
            binding: target/aarch64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/aarch64-unknown-linux-gnu/release/krx
          - id: win32-x64-msvc
            runner: windows-2025
            rust-target: x86_64-pc-windows-msvc
            node-arch: x64
            binding: target/x86_64-pc-windows-msvc/release/krx_node.dll
            executable: target/x86_64-pc-windows-msvc/release/krx.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}
      - name: Install pinned Rust toolchain and target
        run: rustup toolchain install 1.92.0 --profile minimal --target ${{ matrix.rust-target }}
      - name: Build the native package members once
        run: cargo build --locked --release --target ${{ matrix.rust-target }} -p krx-cli -p krx-node
      - name: Assemble the manifest-certified package
        run:
          node scripts/native-package/assemble.mjs --target ${{ matrix.id }} --binding ${{ matrix.binding
          }} --executable ${{ matrix.executable }} --out target/native-package/${{ matrix.id
          }}/package
      - name: Pack the private target archive
        run:
          node scripts/native-package/pack.mjs --package target/native-package/${{ matrix.id }}/package
          --target ${{ matrix.id }} --artifacts target/native-package/${{ matrix.id }}/artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: krx-native-archive-${{ matrix.id }}
          path: target/native-package/${{ matrix.id }}/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
    needs: verify
  consume:
    name: Consume ${{ matrix.target.id }} / Node ${{ matrix.node }}
    needs:
      - build
      - verify-native
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        target:
          - id: linux-x64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            node-arch: x64
          - id: linux-arm64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            node-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.node-arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: krx-native-archive-${{ matrix.target.id }}
          path: target/native-package/download/${{ matrix.target.id }}
      - name: Certify the exact packed artifact
        shell: bash
        run:
          node scripts/native-package/certify.mjs --tarball target/native-package/download/${{
          matrix.target.id }}/*.tgz --target ${{ matrix.target.id }} --report
          target/native-package/certification/${{ matrix.target.id }}-node${{ matrix.node }}.json
      - name: Certify frozen installed-product compatibility
        if: matrix.node == 24
        shell: bash
        run:
          node scripts/compat-certify.mjs --candidate-tarball target/native-package/download/${{
          matrix.target.id }}/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: krx-native-report-${{ matrix.target.id }}-node${{ matrix.node }}
          path: target/native-package/certification/*.json
          if-no-files-found: error
          retention-days: 14
  certification:
    name: Assemble release with Linux certification
    needs:
      - build
      - consume
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: krx-native-report-*
          path: target/native-package/reports
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: krx-native-archive-*
          path: target/native-package/archives
          merge-multiple: true
      - name: Collect all target archives and Linux certification
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run:
          node scripts/native-package/release-assets.mjs --artifacts target/native-package/archives
          --reports target/native-package/reports --out target/native-package/release --revision
          "$SOURCE_REVISION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: krx-release
          path: target/native-package/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish verified private release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: certification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: krx-release
          path: target/native-package/release
      - name: Upload, read back, and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/native-package/publish-release.mjs target/native-package/release "$RELEASE_TAG"
