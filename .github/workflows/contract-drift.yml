name: KRX Contract Drift

on:
  schedule:
    - cron: "20 21 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan calls without contacting KRX or its specification site
        required: true
        default: true
        type: boolean
      date:
        description: Optional confirmed KRX trading date in YYYYMMDD format
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: krx-contract-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      KRX_CONTRACT_DATE: ${{ inputs.date || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check current KRX trading calendar
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: pnpm calendar:check

      - name: Report planned calls
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: pnpm contract:dry-run -- --report artifacts/krx-contract-report.json

      - name: Install pinned Rust toolchain
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Build the native SDK and CLI
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: cargo build --locked --release -p krx-cli -p krx-node

      - name: Assemble the native SDK package
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: >-
          node scripts/native-package/assemble.mjs
          --target linux-x64-gnu
          --binding target/release/libkrx_node.so
          --executable target/release/krx
          --out target/native-package/package

      - name: Check live KRX contracts through the shared native SDK
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: >-
          pnpm contract:check --
          --package target/native-package/package
          --report artifacts/krx-contract-report.json
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      - name: Upload redacted contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krx-contract-report
          path: artifacts/krx-contract-report.json
          if-no-files-found: warn
          retention-days: 14
