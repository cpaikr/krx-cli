name: Native package certification

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/rust-vertical-slice.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "contracts/**"
      - "crates/krx-cli/**"
      - "crates/krx-node/**"
      - "crates/krx-sdk/**"
      - "deny.toml"
      - "package.json"
      - "packages/node/**"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "scripts/native-package/**"
      - "scripts/compat-certify.mjs"
      - "scripts/compat-judge.mjs"
      - "scripts/package-smoke-command.mjs"
      - "scripts/rust-vertical-slice.mjs"
      - "skills/krx-cli/**"
      - "src/calendar/krx-closures.json"
      - "tests/compat/**"
      - "tests/fixtures/adjusted-stock-prices/oracles.json"
      - "tests/scripts/release-policy.test.ts"
      - "tests/scripts/rust-vertical-slice.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS ARM64 and Windows x64 remain supported package targets, but
        # continuous CI intentionally omits them to reduce compute cost.
        include:
          - id: linux-x64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            rust-target: x86_64-unknown-linux-gnu
            node-arch: x64
            binding: target/x86_64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/x86_64-unknown-linux-gnu/release/krx
          - id: linux-arm64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            rust-target: aarch64-unknown-linux-gnu
            node-arch: arm64
            binding: target/aarch64-unknown-linux-gnu/release/libkrx_node.so
            executable: target/aarch64-unknown-linux-gnu/release/krx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}

      - name: Install pinned Rust toolchain and target
        run: >-
          rustup toolchain install 1.92.0
          --profile minimal
          --component rustfmt,clippy
          --target ${{ matrix.rust-target }}

      - name: Enforce Rust advisory, license, ban, and source policy
        if: matrix.id == 'linux-x64-gnu'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans licenses sources

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compile the production workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint the production workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test the host-native production workspace
        run: cargo test --locked --workspace --all-features

      - name: Build the native package members once
        run: >-
          cargo build --locked --release --target ${{ matrix.rust-target }}
          -p krx-cli -p krx-node

      - name: Assemble the manifest-certified package
        run: >-
          node scripts/native-package/assemble.mjs
          --target ${{ matrix.id }}
          --binding ${{ matrix.binding }}
          --executable ${{ matrix.executable }}
          --out target/native-package/${{ matrix.id }}/package

      - name: Pack the private target archive
        run: >-
          node scripts/native-package/pack.mjs
          --package target/native-package/${{ matrix.id }}/package
          --target ${{ matrix.id }}
          --artifacts target/native-package/${{ matrix.id }}/artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krx-native-${{ matrix.id }}
          path: target/native-package/${{ matrix.id }}/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  consume:
    name: Consume ${{ matrix.target.id }} / Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # macOS ARM64 and Windows x64 are omitted here for the same compute-cost policy.
        target:
          - id: linux-x64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            node-arch: x64
          - id: linux-arm64-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            node-arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.node-arch }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krx-native-${{ matrix.target.id }}
          path: target/native-package/download/${{ matrix.target.id }}

      - name: Certify the exact packed artifact
        shell: bash
        run: >-
          node scripts/native-package/certify.mjs
          --tarball target/native-package/download/${{ matrix.target.id }}/*.tgz
          --target ${{ matrix.target.id }}
          --report target/native-package/certification/${{ matrix.target.id }}-node${{ matrix.node }}.json

      - name: Certify frozen installed-product compatibility
        if: matrix.node == 24
        shell: bash
        run: >-
          node scripts/compat-certify.mjs
          --candidate-tarball target/native-package/download/${{ matrix.target.id }}/*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krx-native-report-${{ matrix.target.id }}-node${{ matrix.node }}
          path: target/native-package/certification/*.json
          if-no-files-found: error
          retention-days: 14

  certification:
    name: Linux native certification
    if: always()
    needs: [build, consume]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require every build and Node consumer
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONSUME_RESULT: ${{ needs.consume.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CONSUME_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: krx-native-report-*
          path: target/native-package/reports
          merge-multiple: true

      - name: Compare target-independent package identity
        run: >-
          node scripts/native-package/compare-reports.mjs
          --reports target/native-package/reports
