[workspace]
members = ["sdk", "consumer", "cli", "node"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
futures-util = "=0.3.34"
keyring = "=4.1.6"
napi = { version = "=3.12.2", default-features = false, features = ["async", "napi8", "tokio_rt"] }
napi-build = "=2.4.1"
napi-derive = "=3.6.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.19"
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
